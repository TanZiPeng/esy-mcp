<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESY AI 智能助手 - 客户嵌入演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; color: #333; }
    header .info { font-size: 13px; color: #888; }
    .container { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 240px; background: #fff; border-right: 1px solid #e8e8e8; padding: 20px; }
    .sidebar h3 { font-size: 14px; color: #666; margin-bottom: 12px; }
    .sidebar .field { margin-bottom: 12px; }
    .sidebar label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
    .sidebar input { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    .sidebar button { width: 100%; padding: 8px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-top: 8px; }
    .sidebar button:hover { background: #40a9ff; }
    .iframe-wrapper { flex: 1; padding: 0; }
    .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <h1>🏠 客户设备管理平台（模拟）</h1>
    <div class="info">通过 iframe 嵌入 ESY AI 智能助手</div>
  </header>
  <div class="container">
    <div class="sidebar">
      <h3>参数配置</h3>
      <div class="field">
        <label>用户名 (username)</label>
        <input type="text" id="username" value="2133261080@qq.com">
      </div>
      <div class="field">
        <label>Web Session Token</label>
        <input type="text" id="token" value="c4b7a094-cd75-4883-9b82-12ed25810b2f">
      </div>
      <button onclick="loadIframe()">加载 AI 助手</button>
    </div>
    <div class="iframe-wrapper">
      <iframe id="ai-frame" src="https://esy.bosicloud.com/ai-fae-platform?username=2133261080@qq.com&websessiontoken=c4b7a094-cd75-4883-9b82-12ed25810b2f"></iframe>
    </div>
  </div>
  <script>
    function loadIframe() {
      const username = document.getElementById('username').value;
      const token = document.getElementById('token').value;
      const url = `https://esy.bosicloud.com/ai-fae-platform?username=${encodeURIComponent(username)}&websessiontoken=${encodeURIComponent(token)}`;
      document.getElementById('ai-frame').src = url;
    }
  </script>
</body>
</html>
